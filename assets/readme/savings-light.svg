<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 890 200"><style>@keyframes countUp{0%{opacity:0;transform:translateY(10px)}}@keyframes barGrow{0%{transform:scaleX(0)}}@keyframes shimmer{0%{opacity:.75}50%{opacity:1}}@keyframes numberPulse{0%{transform:scale(1)}50%{transform:scale(1.03)}}.big-stat{transform-box:fill-box;transform-origin:center center;animation:countUp .8s ease-out both,numberPulse 4s ease-in-out 1s infinite}.bar-budget{transform-origin:left center}.bar-free{animation:barGrow .8s ease-out .2s both}.bar-free,.bar-premium{transform-origin:left center}.bar-budget{animation:barGrow .8s ease-out .5s both}.bar-premium{animation:barGrow .8s ease-out .8s both}.bar-label{animation:countUp .5s ease-out 1.2s both}.shimmer{animation:shimmer 3s ease-in-out infinite}</style><rect width="890" height="200" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1" rx="14"/><text x="125" y="55" fill="#656d76" font-family="system-ui, sans-serif" font-size="13" font-weight="600" opacity=".8" text-anchor="middle">PROVEN SAVINGS</text><g class="big-stat"><text x="125" y="115" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="52" font-weight="800" text-anchor="middle">60–80%</text></g><text x="125" y="140" fill="#656d76" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">cost reduction</text><text x="125" y="160" fill="#656d76" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Actual vs baseline spend</text><text x="125" y="178" fill="#656d76" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cumulative across sessions</text><line x1="240" x2="240" y1="30" y2="170" stroke="#d1d9e0" stroke-width="1" opacity=".5"/><text x="565" y="42" fill="#656d76" font-family="system-ui, sans-serif" font-size="13" font-weight="600" opacity=".8" text-anchor="middle">TOKEN DISTRIBUTION</text><g class="bar-free"><rect width="180" height="36" x="260" y="60" fill="#10B981" class="shimmer" rx="6"/><text x="350" y="83" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">31% Free</text></g><g class="bar-budget"><rect width="220" height="36" x="440" y="60" fill="#F59E0B" class="shimmer"/><text x="550" y="83" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">38% Budget</text></g><g class="bar-premium"><rect width="180" height="36" x="660" y="60" fill="#EF4444" class="shimmer" rx="6"/><text x="750" y="83" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">31% Premium</text></g><g class="bar-label"><text x="350" y="120" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Free</text><text x="350" y="140" fill="#656d76" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Ollama + Codex</text></g><g class="bar-label"><text x="550" y="120" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Low cost</text><text x="550" y="140" fill="#656d76" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Flash + GPT-4o-mini</text></g><g class="bar-label"><text x="750" y="120" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Premium</text><text x="750" y="140" fill="#656d76" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">GPT-4o + Claude</text></g><text x="565" y="180" fill="#656d76" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Savings vary by workload — see methodology below</text></svg>